name: Finalize Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published npm version to finalize (omit to check all stable version tags)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: finalize-release
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'kKsk03/mdv'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Finalize publicly available versions
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: |
            const { pathToFileURL } = await import('node:url')
            const scriptUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/finalize-release.mjs`)
            const { finalizeReleases } = await import(scriptUrl.href)
            const result = await finalizeReleases({
              github,
              ...context.repo,
              version: process.env.RELEASE_VERSION,
              log: (message) => core.info(message),
            })
            await core.summary
              .addHeading('GitHub Release finalization')
              .addTable([
                [{ data: 'Result', header: true }, { data: 'Versions', header: true }],
                ['Created', result.created.join(', ') || 'None'],
                ['Waiting for npm', result.waiting.join(', ') || 'None'],
                ['Already present', result.existing.join(', ') || 'None'],
                ['Skipped package/tag mismatch', result.skipped.join(', ') || 'None'],
              ])
              .addHeading('Next step')
              .addRaw(
                `This workflow only creates GitHub Releases; it does not publish to npm. First publish and approve the matching version of \`@mdv-ui/mdv\` on npm. Then [run Finalize Release again](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/workflows/finalize-release.yml) with the version number (for example, \`0.1.3\`, without the \`v\` prefix). A version listed under **Waiting for npm** is not public yet.`,
              )
              .write()
