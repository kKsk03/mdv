name: Finalize Release

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Published npm version to finalize (leave empty to check all version tags)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: finalize-release
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'kKsk03/mdv' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Finalize publicly available versions
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: |
            const { pathToFileURL } = await import('node:url')
            const scriptUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/finalize-release.mjs`)
            const { finalizeReleases } = await import(scriptUrl.href)
            const result = await finalizeReleases({
              github,
              ...context.repo,
              version: process.env.RELEASE_VERSION,
              log: (message) => core.info(message),
            })
            await core.summary
              .addHeading('GitHub Release finalization')
              .addTable([
                [{ data: 'Result', header: true }, { data: 'Versions', header: true }],
                ['Created', result.created.join(', ') || 'None'],
                ['Waiting for npm', result.waiting.join(', ') || 'None'],
                ['Already present', result.existing.join(', ') || 'None'],
                ['Skipped package/tag mismatch', result.skipped.join(', ') || 'None'],
              ])
              .write()
