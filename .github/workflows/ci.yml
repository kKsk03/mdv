name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm type-check
      - name: Unit tests
        run: pnpm test:unit
      - name: Lint
        run: pnpm lint:check
      - name: Format
        run: pnpm format:check
      - name: Library build
        run: pnpm build-only
      - name: Declarations
        run: pnpm build:types
